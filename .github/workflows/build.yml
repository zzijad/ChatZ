name: Build ChatZ

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish ChatZ.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath ChatZ-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChatZ-win-x64
          path: ChatZ-win-x64.zip

      - name: Release (samo za tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChatZ-win-x64.zip
