name: Build ChatZ

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish ChatZ.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Zip
        run: Compress-Archive -Path publish\* -DestinationPath ChatZ-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChatZ-win-x64
          path: ChatZ-win-x64.zip

      - name: Verzija iz csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content ChatZ.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$v" >> $env:GITHUB_OUTPUT

      # Release v<verzija> se pravi (ili osvežava) posle svakog builda na main.
      # Za novu verziju dovoljno je podići <Version> u ChatZ.csproj.
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ChatZ ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ChatZ-win-x64.zip
